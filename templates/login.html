<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WattWise AI" />
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card panel">
      <div class="brand auth-brand">
        <span class="brand-bolt"></span>
        <span class="brand-text">WattWise AI</span>
      </div>

      <div class="eyebrow">Secure Login</div>
      <h1 class="auth-title">Welcome back, energy guardian.</h1>
      <p class="auth-copy">Sign in with your user ID and password to view AI forecasts, appliance health, payments, and your energy pet.</p>

      {% if error_message %}
      <div class="auth-error">{{ error_message }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login', next=next_url) }}" class="auth-form">
        <label class="field-label">
          User ID
          <input class="field-input" name="username" autocomplete="username" value="{{ default_username }}" placeholder="admin" required />
        </label>
        <label class="field-label">
          Password
          <input class="field-input" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </label>
        <button type="submit" class="primary-action action-wide">Login & Continue</button>
      </form>

      <div class="auth-meta">
        <span class="meta-chip live-chip"><span class="live-dot"></span>Secure Session</span>
        <span class="meta-chip">PWA Ready</span>
      </div>
    </section>
  </main>
</body>
</html>
